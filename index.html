    background:#00c853;
    color:white;
    font-size:15px;
    font-weight:bold;

button:active{

function createField(label,value){

return `
<div class="card">
    <div class="label">${label}</div>

    <div class="value">${value}</div>

    <button onclick="copyText('${value}',this)">
        คัดลอก
    </button>
</div>
`;

}

function generateMenu(){

const select=document.getElementById("personSelect");

select.innerHTML="";

people.forEach((person,index)=>{

select.innerHTML += `<option value="${index}">${person.nickname}</option>`;

});

}

function loadPerson(){

const index=document.getElementById("personSelect").value;

const p=people[index];
    
if(p.password){

const input=prompt("กรอกรหัสผ่าน");

if(input !== p.password){

alert("รหัสไม่ถูกต้อง");

return;

}

}

document.getElementById("info").innerHTML=`

${createField("Staff Id",p.staff)}
${createField("ชื่อ สกุล",p.fullname)}
${createField("ชื่อเล่น",p.nickname)}
${createField("เบอร์โทร",p.phone)}
${createField("ทะเบียนรถ",p.plate)}
${createField("ตำแหน่ง",p.position)}
${createField("Hub",p.hub)}
${createField("โซน",p.zone)}
${createField("โซนตะกร้า",p.basket)}

`;

}

function copyText(text,btn){

navigator.clipboard.writeText(text);

const old=btn.innerText;

btn.innerText="✓ คัดลอกแล้ว";

setTimeout(()=>{
btn.innerText=old;
},1500);

}
